<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Test</title>
    <style>
        :root {
            --ink: #1b2a4a;
            --muted: #5d6b8a;
            --accent: #3b5bdb;
            --accent-2: #7048e8;
            --card: #ffffff;
            --bg-1: #dbe7ff;
            --bg-2: #efe4ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 44px 36px;
            text-align: center;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(59, 91, 219, 0.18);
            animation: rise 0.6s ease both;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .container > p:first-of-type {
            display: inline-block;
            margin: 0 0 20px;
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
            background: #edf1ff;
            border-radius: 999px;
        }

        h2 {
            margin: 0 0 28px;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--muted);
        }

        button {
            padding: 14px 32px;
            font: inherit;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(112, 72, 232, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(112, 72, 232, 0.4);
        }

        button:active { transform: translateY(0); }

        button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        #message {
            min-height: 1.5em;
            margin: 24px 0 0;
            font-weight: 600;
            color: #2b8a3e;
        }

        #message.show { animation: pop 0.3s ease both; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: none; }
        }

        @keyframes pop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .container, #message.show { animation: none; }
            button { transition: none; }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>DevOps CI/CD</h1>

        <p>
            GitHub → Jenkins → Build → Deploy → Telegram
        </p>
        <h2>
            hihiihihihihihahahaha
        </h2>

        <button onclick="showMessage()">
            Test Website
        </button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            const el = document.getElementById("message");
            el.textContent = "Website đang chạy thành công! 🚀";
            el.classList.remove("show");
            void el.offsetWidth; // chạy lại animation
            el.classList.add("show");
        }
    </script>

</body>
</html>
